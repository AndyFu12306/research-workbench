name: Python checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install uv
        run: python -m pip install uv==0.13.6
      - name: Install locked development dependencies
        run: uv sync --frozen --extra dev
      - name: Format
        run: uv run --frozen --extra dev ruff format --check src tests
      - name: Lint
        run: uv run --frozen --extra dev ruff check src tests
      - name: Unit tests (no Zotero required)
        run: uv run --frozen --extra dev pytest
